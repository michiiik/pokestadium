name: Public PR ROM Gate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Public PR number to validate using its merge ref
        required: false
      ref:
        description: Same-repository branch or SHA when no PR is supplied
        required: false
        default: master

permissions:
  contents: read

concurrency:
  group: public-pokestadium-rom-gate-${{ github.event.pull_request.number || inputs.pr_number || inputs.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) ||
      (
        github.event.pull_request.user.login == 'pokestadium-public-ci[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'ci/refresh-coverage'
      )
    runs-on: [self-hosted, macOS, ARM64, pokestadium-decomp-public]
    timeout-minutes: 30
    steps:
      - name: Mask self-hosted runner paths
        shell: bash
        run: |
          echo "::add-mask::${HOME}"
          echo "::add-mask::${GITHUB_WORKSPACE}"
          echo "::add-mask::${RUNNER_TEMP}"
      - name: Checkout the PR merge ref or selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || inputs.ref }}
          persist-credentials: false
          set-safe-directory: false
      - name: Detect a coverage-only diff
        id: coverage-only
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if [ "$changed" = 'COVERAGE.md' ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'coverage-only refresh: no ROM-affecting source changed.' >&2
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and compare against the retail checksum
        if: steps.coverage-only.outputs.skip != 'true'
        shell: bash
        run: bash ci/gate-pr.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pokestadium-gate-out"
      - name: Upload gate and proposed coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-pokestadium-rom-gate-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
          path: ${{ runner.temp }}/pokestadium-gate-out/
          if-no-files-found: warn
          retention-days: 14
