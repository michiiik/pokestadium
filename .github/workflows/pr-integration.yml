name: Public PR Integration
on:
  workflow_run:
    workflows: [Public PR ROM Gate]
    types: [completed]
permissions: {contents: read, pull-requests: read}
jobs:
  integrate:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    steps:
      - id: eligible
        uses: actions/github-script@v7
        with:
          script: |
            const p=context.payload.workflow_run.pull_requests[0], {data:pr}=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:p.number});
            const same=pr.head.repo?.full_name===`${context.repo.owner}/${context.repo.repo}`;
            const trusted=['OWNER','MEMBER','COLLABORATOR'].includes(pr.author_association);
            const coverage=pr.head.ref==='ci/refresh-coverage' && pr.user.login==='pokestadium-public-ci[bot]';
            core.setOutput('ok',same && (trusted || coverage) && !pr.draft && pr.base.ref==='master' && pr.head.sha===p.head.sha ? 'true':'false'); core.setOutput('number',p.number);
      - if: steps.eligible.outputs.ok == 'true' && vars.PUBLIC_CI_AUTOMERGE_ENABLED == 'true'
        uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ vars.PUBLIC_CI_APP_ID }}
          private-key: ${{ secrets.PUBLIC_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write
      - if: steps.eligible.outputs.ok == 'true' && vars.PUBLIC_CI_AUTOMERGE_ENABLED == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.eligible.outputs.number }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const {data:pr}=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:Number(process.env.PR_NUMBER)});
            await github.graphql(`mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:SQUASH}){pullRequest{number}}}`,{id:pr.node_id});
