name: Public PR Integration
on:
  workflow_run:
    workflows: [Public PR ROM Gate]
    types: [completed]
permissions: {contents: read, pull-requests: read}
jobs:
  integrate:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    steps:
      - id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const p = github.event.workflow_run.pull_requests[0];
            const {data: pr} = await github.rest.pulls.get({owner: context.repo.owner, repo: context.repo.repo, pull_number: p.number});
            const trusted = ['OWNER','MEMBER','COLLABORATOR'].includes(pr.author_association) && pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`;
            const controls = (await github.paginate(github.rest.pulls.listFiles,{owner:context.repo.owner,repo:context.repo.repo,pull_number:p.number})).some(f => f.filename.startsWith('.github/') || f.filename.startsWith('ci/') || f.filename === '.dockerignore');
            core.setOutput('eligible', trusted && !controls && !pr.draft && pr.base.ref === 'master' && pr.head.sha === p.head.sha ? 'true' : 'false'); core.setOutput('number', p.number);
      - if: steps.pr.outputs.eligible == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
          path: pr
          persist-credentials: false
      - if: steps.pr.outputs.eligible == 'true'
        run: python3 pr/ci/update_coverage.py --repo-root pr --output "$RUNNER_TEMP/COVERAGE.md"
      - if: steps.pr.outputs.eligible == 'true'
        id: changed
        run: cmp -s "$RUNNER_TEMP/COVERAGE.md" pr/COVERAGE.md && echo changed=false >> "$GITHUB_OUTPUT" || echo changed=true >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.eligible == 'true' && (steps.changed.outputs.changed == 'true' || vars.PUBLIC_CI_AUTOMERGE_ENABLED == 'true')
        uses: actions/create-github-app-token@v3
        id: token
        with:
          app-id: ${{ vars.PUBLIC_CI_APP_ID }}
          private-key: ${{ secrets.PUBLIC_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - if: steps.pr.outputs.eligible == 'true' && steps.changed.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          COVERAGE: ${{ runner.temp }}/COVERAGE.md
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const fs=require('fs'), n=Number(process.env.PR_NUMBER), {data:p}=await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:n});
            const {data:f}=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path:'COVERAGE.md',ref:p.head.ref});
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path:'COVERAGE.md',branch:p.head.ref,sha:f.sha,content:fs.readFileSync(process.env.COVERAGE).toString('base64'),message:`ci: update coverage for #${n}`});
      - if: steps.pr.outputs.eligible == 'true' && steps.changed.outputs.changed == 'false' && vars.PUBLIC_CI_AUTOMERGE_ENABLED == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          github-token: ${{ steps.token.outputs.token }}
          script: |
            const n = Number(process.env.PR_NUMBER);
            const {data: pr} = await github.rest.pulls.get({owner:context.repo.owner,repo:context.repo.repo,pull_number:n});
            if (pr.state !== 'open' || pr.base.ref !== 'master') core.setFailed('PR changed before auto-merge could be enabled.');
            await github.graphql(`mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number } } }`, {id: pr.node_id});
